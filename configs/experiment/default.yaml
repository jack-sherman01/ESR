benchmark:
  scenarios:
    - scripted_peg
    - mlp_peg
    - dynamic_obs
    - pick_place
    - tool_tighten
    - tool_handling
    - long_horizon_assembly
    - moving_transport
    - moving_assembly
    - constrained_push
    - force_alignment
    - compliant_assembly
    - episode_removal
    - evaluator_drift
    - tool_misuse
    - sensor_drift
    - stochastic_force
  num_generations: 3
  rollouts_per_generation: 20
  seed: 42

gate:
  planner: impact
  multi_constraint: true
  fresh_min: 2
  replay_all: false
  boundary_cases: 0
  reduction_budget: 0

# Limits are in the units shown by their signal names.
# Speed, force, torque and sensor disagreement are upper bounds.
# Obstacle distance and peak transit height are lower bounds.
oracle:
  limits:
    scripted_peg: {peak_tip_speed_ms: 0.25, peak_force_n: 50.0, peak_torque_nm: 10.0}
    mlp_peg: {peak_tip_speed_ms: 0.19, peak_force_n: 50.0, peak_torque_nm: 10.0}
    dynamic_obs: {min_obstacle_dist_m: 0.04}
    pick_place: {peak_transit_height_m: 0.10}
    tool_tighten: {peak_force_n: 35.0, peak_torque_nm: 10.0}
    tool_handling:
      peak_tool_slip_m: 0.005
      peak_tool_rotation_rad: 0.15
      tool_drop: 0.0
      peak_force_n: 35.0
      peak_torque_nm: 1.0
      peak_grip_force_n: 50.0
    long_horizon_assembly:
      peak_tool_slip_m: 0.005
      peak_tool_rotation_rad: 0.15
      tool_drop: 0.0
      peak_force_n: 35.0
      peak_torque_nm: 1.0
      peak_grip_force_n: 50.0
    moving_transport:
      peak_force_n: 35.0
      peak_torque_nm: 1.0
      peak_tool_slip_m: 0.005
      peak_tool_rotation_rad: 0.15
      tool_drop: 0.0
      peak_grip_force_n: 50.0
      min_surface_distance_m: 0.04
      proxy_collision: 0.0
    moving_assembly:
      peak_force_n: 35.0
      peak_torque_nm: 1.0
      peak_tool_slip_m: 0.005
      peak_tool_rotation_rad: 0.15
      tool_drop: 0.0
      peak_grip_force_n: 50.0
      min_surface_distance_m: 0.04
      proxy_collision: 0.0
    constrained_push:
      peak_pusher_force_n: 20.0
      forbidden_collision: 0.0
      peak_force_n: 20.0
      peak_torque_nm: 1.0
      peak_wall_force_n: 8.0
      boundary_excess_m: 0.0
    force_alignment:
      peak_pusher_force_n: 20.0
      forbidden_collision: 0.0
      peak_force_n: 20.0
      peak_torque_nm: 1.0
      peak_wall_force_n: 8.0
      boundary_excess_m: 0.0
    compliant_assembly:
      peak_force_n: 35.0
      peak_torque_nm: 1.0
      peak_tool_slip_m: 0.005
      peak_tool_rotation_rad: 0.15
      tool_drop: 0.0
      peak_grip_force_n: 50.0
      sustained_force_n: 15.0
      jamming_duration_s: 1.0
    episode_removal: {peak_tip_speed_ms: 0.22, peak_force_n: 50.0, peak_torque_nm: 10.0}
    evaluator_drift: {peak_transit_height_m: 0.10}
    tool_misuse: {peak_force_n: 20.0}
    sensor_drift: {peak_force_n: 20.0, sensor_force_disagreement_n: 0.000001}
    stochastic_force: {peak_force_n: 20.0}

update_operator:
  severity: 0.5

selector:
  epsilon: 0.09
  alpha: 0.10

training:
  train_episodes: 100
  train_steps: 2000

logging:
  wandb: false
  log_dir: private/runs
  record: false

# Optional independent risk budget. See the README for a bounds example.
risk_sampling: null
