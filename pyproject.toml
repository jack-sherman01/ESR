[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esrb"
version = "0.1.0"
description = "Evolutionary Safety Regression Benchmark for agentic robot improvement loops"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "networkx>=3.0",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
ml  = ["torch>=2.0"]
sim = ["mujoco>=3.11", "pillow>=10", "matplotlib>=3.8"]
dev = [
    "pytest>=8.0",
    "wandb>=0.17",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
]
all = [
    "torch>=2.0",
    "mujoco>=3.11",
    "pillow>=10",
    "matplotlib>=3.8",
    "pytest>=8.0",
    "wandb>=0.17",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
]

[project.scripts]
esrb = "esrb.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["esrb*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
esrb = ["tasks/**/assets/*.xml", "tasks/production/assets/*", "tasks/contact_workcells/assets/*", "tasks/tool_handling/assets/*.obj", "tasks/tool_handling/assets/panda/*", "tasks/tool_handling/assets/panda/assets/*", "tasks/tool_handling/assets/robosuite/*"]
"esrb.cli" = ["commands.json"]
