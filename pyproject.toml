[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "esrb"
version = "0.1.0"
description = "Evolutionary Safety Regression Benchmark for agentic robot improvement loops"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "networkx>=3.3",
    "pydantic>=2.7",
    "rich>=13.7",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "torch>=2.3",
    "mujoco>=3.1",
    "wandb>=0.17",
    "pytest>=8.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["esrb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
