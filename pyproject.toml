[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "esrb"
version = "0.1.0"
description = "Evolutionary Safety Regression Benchmark for agentic robot improvement loops"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "networkx>=3.0",
    "pydantic>=2.0",
    "rich>=13.0",
]

[project.optional-dependencies]
ml  = ["torch>=2.0"]
sim = ["mujoco>=3.1"]
dev = [
    "pytest>=8.0",
    "wandb>=0.17",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
]
all = [
    "torch>=2.0",
    "mujoco>=3.1",
    "pytest>=8.0",
    "wandb>=0.17",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["esrb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
